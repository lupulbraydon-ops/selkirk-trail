const GATE={on:!['localhost','127.0.0.1',''].includes(location.hostname),hash:'a047f2788d705e78a5ed5771aba37362bb9100245b5d9e4b9c465df798c77e31'};
async function sha256(str){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}
function gateOpen(){try{return !GATE.on||localStorage.getItem('selkirk-gate')===GATE.hash;}catch(_){return !GATE.on;}}

function P(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x)*PX,Math.round(y)*PX,Math.round(w)*PX,Math.round(h)*PX);}
function L(x1,y1,x2,y2,c,w){ctx.strokeStyle=c;ctx.lineWidth=(w||1)*PX;ctx.beginPath();ctx.moveTo(x1*PX,y1*PX);ctx.lineTo(x2*PX,y2*PX);ctx.stroke();}
function txt(s,x,y,size,color,align){ctx.font=size+'px "VT323", "Courier New", monospace';ctx.fillStyle=color||'#fff';ctx.textAlign=align||'left';ctx.textBaseline='top';ctx.fillText(s,x,y);}
function wrap(s,max){const out=[];for(const para of String(s).split('\n')){let line='';for(const w of para.split(' ')){if((line+' '+w).trim().length>max){out.push(line.trim());line=w;}else line+=' '+w;}out.push(line.trim());}return out;}
function fmt(n){n=Math.round(n);const neg=n<0;n=Math.abs(n);let s=n>=1e6?'$'+(n/1e6).toFixed(1)+'M':n>=1000?'$'+Math.round(n/1000)+'K':'$'+n;return (neg?'-':'')+s;}
function fmtFull(n){return (n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('en-CA');}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}

 graves:[],role:null,name:'',moving:false,msIndex:0,page:0,sel:0,queue:[],ret:'travel',lastTick:0,deathReason:'',fired:0,quit:0,late:0,extras:[],fredisAway:0,fredisLeftAt:0,fredisRetAt:0};}
newGame();if(!gateOpen())S.screen='gate';
const alive=()=>S.party.filter(p=>p.alive);
const fredisHere=()=>{const f=S.party.find(p=>p.name==='Fredis');return !!(f&&f.alive)&&S.fredisAway<=0;};
const fredisAlive=()=>{const f=S.party.find(p=>p.name==='Fredis');return !!(f&&f.alive);};
const now=()=>performance.now()/1000;
function fredisLeaves(weeks){S.fredisAway=weeks;S.fredisLeftAt=now();}
const FREDIS_TALK=["Fredis looks at you. Fredis says nothing. Fredis gets in his truck.","You say 'Morning, Fredis.' Fredis says nothing. The silence lasts four minutes. You leave.","Fredis is on the phone in Spanish. It is not a happy call. He points east, toward Calgary.","Fredis's reply is a single word. It is not a word you know. Tanya confirms it is not a safety word.","Fredis nods. It is the most he has said all month. Scott calls it a breakthrough."];
const burn=()=>CFG.burn*[1,1.25,1.7][S.pace];
const PACES=['Steady (MOTI approved)','Strenuous (10s, 6 days)','Grueling (24/7, lights on)'];
const RATIONS=['Filling (double-double)','Meager (one per shift)','Bare bones (instant)'];

function show(m){S.queue.push(m);S.screen='msg';S.sel=0;S.moving=false;}
function applyFx(fx){if(!fx)return;
 if(fx.weeks){S.week+=fx.weeks;S.loss+=burn()*fx.weeks;}
 if(fx.loss)S.loss+=fx.loss;
 for(const k of ['fuel','coffee','trucks','dozers','graders','vests','tracks','crane'])if(fx[k])S[k]=Math.max(0,S[k]+fx[k]);
 if(fx.health)for(const p of alive())p.health=Math.max(1,Math.min(100,p.health+fx.health));
}
function fire(reason){const a=alive();if(!a.length){gameover(reason);return;}
 const v=rnd(a);v.alive=false;v.gone='Andy';S.fired++;S.graves.push({name:v.name,epi:reason});
 show({t:`Andy Smith killed ${v.name} because ${reason}.`,andy:true});}
function leave(p){p.alive=false;p.gone='quit';S.quit++;S.graves.push({name:p.name,epi:'went to the ski hill'});
 if(p.name==='Fredis'){S.fredisAway=0;fredisLeaves(999);show({t:"Fredis went to Calgary and did not come back. He sent one text. It said 'no'."});return;}
 show({t:`${p.name} quit to go work at Kicking Horse Resort. ${p.name} says the snow is more reliable than the schedule.`});}
function gameover(reason){S.deathReason=reason;S.moving=false;S.screen='dead';S.queue=[];}
function randomEvent(){const pool=EVENTS.filter(e=>!e.cond||e.cond(S));const e=pickW(pool);
 if(e.kill){show({t:e.t,then:()=>fire(e.kill)});return;}
 if(e.ch){show({t:e.t,ch:e.ch.filter(c=>!c.cond||c.cond(S))});return;}
 applyFx(e.fx);if(e.on)e.on(S);show({t:e.t});}
function illness(){const a=alive();if(!a.length)return;const p=rnd(a.filter(x=>!x.cond));if(!p)return;p.cond=rnd(CONDS);p.condWeeks=4;show({t:`${p.name} has ${p.cond}.`});}

function tick(){
 S.week++;
 S.weather=pickW(WEATHERS).n;
 const wf=S.weather==='Snow'?0.7:S.weather==='Smoke'?0.85:S.weather==='Sideways rain'?0.9:1;
 const fleet=S.dozers>0?0.6+0.08*Math.min(S.trucks,6)+(S.graders>0?0.1:0):0.35;
 const pf=[1,1.3,1.6][S.pace];
 let speed=CFG.speed*fleet*pf*wf; if(S.fuel<=0)speed*=0.3;
 if(S.msIndex===2&&!fredisHere())speed*=0.6;   // bridge without the bridge super
 if(S.fredisAway>0&&S.fredisAway<900){if(--S.fredisAway<=0){S.fredisRetAt=now();show({t:rnd(["Fredis is back from Calgary. He is angrier. The abutment forms are, somehow, perfect.","Fredis returned at 4 a.m. He did not say where he was. Nobody asked. His truck has new tires.","Fredis is back. He walked past everyone, looked at the creek for an hour, and went into the trailer."])});return;}}
 const use=(200+S.trucks*350+S.dozers*500+S.graders*250+S.crane*150)*pf;
 const hadFuel=S.fuel>0; S.fuel=Math.max(0,S.fuel-use);
 S.coffee=Math.max(0,S.coffee-[14,7,3][S.ration]*alive().length);
 S.loss+=burn();
 const dh=[-1,-2,-4][S.pace]+[2,0,-2][S.ration]+(S.coffee<=0?-4:0)+(S.weather==='Snow'?-2:0);
 for(const p of alive()){p.health+=dh;if(p.cond){p.health-=6;if(--p.condWeeks<=0)p.cond=null;}p.health=Math.min(100,p.health);
  if(p.health<=0){leave(p);return;}}
 const next=MILESTONES[S.msIndex];
 S.km=Math.min(S.km+speed,next.km);
 if(S.km>=next.km){reachMilestone(next);return;}
 if(S.fuel<=0&&hadFuel){applyFx({weeks:1,loss:45000,fuel:20000});show({t:"You are out of diesel. Louie siphons the pickup. A fuel truck from Golden brings 20,000 L a week later. $45,000, plus a tip."});return;}
 if(S.coffee<=0&&Math.random()<0.25){show({t:rnd(["The crew is out of coffee. Adam has stopped blinking.","No coffee. Scott is drinking hydraulic fluid 'as a joke'. It is not a joke.","Coffee gone. Lenny has started a fire just to feel something."])});return;}
 const r=Math.random();
 if(r<CFG.illRate)illness(); else if(r<CFG.illRate+CFG.evRate)randomEvent();
}
function reachMilestone(m){S.moving=false;S.msIndex++;S.msCur=m;S.late=Math.max(0,S.week-m.deadline);
 if(S.late>CFG.lateKill){gameover(m.fail);return;}
 if(m.final){S.screen='win';S.page=0;return;}
 S.screen='milestone';S.sel=0;}
function afterMilestone(){const m=S.msCur;S.screen='travel';S.moving=true;S.ret='travel';
 if(m.km===2&&S.crane<=0){applyFx({weeks:4,loss:2500000,crane:1});show({t:"The creek bridge is next and you have no crane. Sterling Crane sends one from Calgary: four weeks and $2,500,000. Fredis watched you not order it. He said nothing."});}
 if(S.late>0)fire(`${m.name} finished ${S.late} week${S.late>1?'s':''} late`);}

 if(p.vest){P(x,base-6,6,1,'#eee');P(x,base-4,6,1,'#eee');}if(p.tie)P(x+2,base-7,1,3,'#c00');if(p.clip)P(x+6,base-8,3,4,'#fff');
 P(x+1,base-3,2,3,p.pants||'#2a2a5a');P(x+3,base-3,2,3,p.pants||'#2a2a5a');}

 P(x+29,base-9,3,4,'#333');P(x+4,base-5,6,5,C.black);P(x+22,base-5,6,5,C.black);P(x+6,base-4,2,2,C.grey);P(x+24,base-4,2,2,C.grey);P(x,base-4,2,2,'#f00');}
function dozerR(x,base,ta){P(x,base-7,24,7,'#3a3a3a');for(let i=0;i<5;i++)P(x+2+((i*5+Math.floor(ta*10))%24),base-4,2,2,C.grey);P(x+2,base-14,18,7,C.yellow);P(x+2,base-14,18,1,C.yellow2);
 P(x+4,base-21,8,7,C.grey2);P(x+5,base-20,6,4,C.glass);P(x+15,base-19,2,5,'#222');P(x+25,base-13,4,13,C.grey);P(x+25,base-13,4,1,C.grey3);P(x-2,base-10,2,9,C.grey2);}
function rockTruck(x,base,loaded){P(x+3,base-6,6,6,C.black);P(x+13,base-6,6,6,C.black);P(x+23,base-6,6,6,C.black);P(x+5,base-4,2,2,C.grey);P(x+15,base-4,2,2,C.grey);P(x+25,base-4,2,2,C.grey);
 P(x+8,base-16,22,10,C.yellow);P(x+6,base-14,2,8,C.yellow);P(x+8,base-16,22,1,C.yellow2);P(x+28,base-15,2,9,C.yellow2);if(loaded){P(x+10,base-19,18,3,C.dirt3);P(x+13,base-21,12,2,C.dirt);}

function grader(x,base){P(x+4,base-6,4,6,C.black);P(x+24,base-6,5,6,C.black);P(x+30,base-6,5,6,C.black);P(x,base-10,36,4,C.yellow);P(x+24,base-18,10,8,C.yellow2);P(x+25,base-17,8,4,C.glass);P(x+10,base-6,12,3,C.grey);P(x,base-11,4,2,C.yellow2);}
function porta(x,base){P(x-1,base-19,12,2,C.blue2);P(x,base-18,10,18,C.blue);P(x+3,base-14,4,12,C.blue3);P(x+4,base-17,2,2,C.blue2);}
function barricade(x,base){P(x,base-8,2,8,'#ddd');P(x+8,base-8,2,8,'#ddd');P(x-1,base-8,12,4,C.orange);P(x+1,base-8,2,4,'#fff');P(x+5,base-8,2,4,'#fff');P(x+4,base-10,2,2,'#ffd400');}
function cone(x,base){P(x+1,base-3,1,3,C.orange);P(x,base-1,3,1,C.orange);P(x+1,base-2,1,1,'#fff');}
function tree(x,y){P(x+2,y,1,2,C.tree);P(x+1,y+2,3,2,C.tree);P(x,y+4,5,2,C.tree);P(x+2,y+6,1,2,C.trunk);}
function bear(x,y){P(x,y+2,12,5,C.bear);P(x+10,y,4,4,C.bear);P(x+10,y-1,1,1,C.bear);P(x+13,y-1,1,1,C.bear);P(x+12,y+1,1,1,'#000');P(x+1,y+7,2,2,C.bear2);P(x+5,y+7,2,2,C.bear2);P(x+9,y+7,2,2,C.bear2);}
function bird(x,y,t,col){const f=Math.floor(t*6)%2;P(x,y+f,1,1,col);P(x+1,y,1,1,col);P(x+2,y+f,1,1,col);}
function puff(x,y,t,seed){for(let k=0;k<3;k++){const ph=((t*0.9)+k/3+seed*0.37)%1;ctx.globalAlpha=0.6*(1-ph);P(x+Math.sin(ph*7+seed)*1.5,y-ph*9,2,2,'#bbb');}ctx.globalAlpha=1;}
function craneR(x,base,t,load,mv){P(x,base-8,30,8,'#3a3a3a');for(let i=0;i<6;i++)P(x+2+i*5,base-5,2,2,C.grey);P(x+2,base-18,26,10,C.yellow);P(x+2,base-18,26,1,C.yellow2);P(x,base-24,10,8,C.yellow2);P(x+2,base-23,6,4,C.glass);P(x+22,base-20,6,3,C.grey2);
 const slew=mv?Math.sin(t*0.5)*5:0;const bx=x+22,by=base-18,tx=x+78+slew,ty=14;L(bx,by,tx,ty,C.yellow,1.5);L(bx-3,by,tx-3,ty,C.yellow,0.8);for(let i=0;i<14;i++){const f=i/14;L(bx+f*(tx-bx),by+f*(ty-by),bx-3+f*(tx-bx),by+f*(ty-by)+2,C.yellow2,0.5);}
 L(x+5,base-24,tx-2,ty,'#cfcfcf',0.4);L(x+8,base-22,tx-2,ty+2,'#cfcfcf',0.4);P(tx-1,ty-1,3,3,C.yellow);
 if(load){const sw=mv?Math.sin(t*1.3)*2:0,hy=ty+40+(mv?Math.sin(t*0.8)*3:0);L(tx+1,ty,tx+1+sw,hy,'#eee',0.4);P(tx-2+sw,hy,6,4,C.yellow);L(tx+1+sw,hy+4,tx-14+sw,hy+10,'#eee',0.4);L(tx+1+sw,hy+4,tx+16+sw,hy+10,'#eee',0.4);P(tx-17+sw,hy+10,36,5,C.girder);P(tx-17+sw,hy+10,36,1,C.girder2);P(tx-17+sw,hy+14,36,1,C.girder3);}
 else{L(tx+1,ty,tx+1,ty+20,'#eee',0.4);P(tx-2,ty+20,6,4,C.yellow);}}
function multiplate(x,y,r,done){for(let dy=0;dy<=r;dy++){const w=Math.sqrt(r*r-dy*dy);const yy=y-dy;P(x-w,yy,2*w,1,'#2a1a0c');P(x-w-1,yy,2,1,(dy%2)?C.grey:C.grey3);P(x+w-1,yy,2,1,(dy%2)?C.grey:C.grey3);}
 P(x-r-1,y,2*r+2,2,C.dirt4);if(done)bear(x-7,y-9);}

function drawScene(v,t){
 const pal=v.night?NIGHT:DAY;const mv=!!v.moving;const ta=mv?t:0;
 P(0,0,SW,SH,pal.sky);
 if(v.night)for(const s of STARS){const tw=(Math.sin(t*2+s.b*10)>0.6&&s.b>0.7)?2:1;P(s.x,s.y,tw,tw,'#fff');}
 // mountains (far, mid, near)
 const peaks=[[60,50,50,pal.m3],[140,45,55,pal.m3],[215,55,50,pal.m3],[285,45,45,pal.m3],[100,85,70,pal.m2],[240,95,80,pal.m2],[30,70,60,pal.m1],[175,60,60,pal.m1],[300,70,60,pal.m1]];
 for(const pk of peaks){const [px,ph,pw,col]=pk;for(let x=Math.max(0,px-pw);x<Math.min(SW,px+pw);x++){const h=ph*(1-Math.abs(x-px)/pw);if(h<=0)continue;const top=88-h;P(x,top,1,h,col);const cap=Math.max(1,h*0.22-Math.abs(((x*7)%5)-2)*0.6);P(x,top,1,cap,pal.snow);}}
 // birds
 for(let i=0;i<2;i++){const bx=((t*10+i*140)%380)-30,by=26+i*14+Math.sin(t*2+i)*2;bird(bx,by,t+i,v.night?'#ddd':'#223');}
 // grass + trees
 P(0,86,SW,14,C.grass);for(let i=0;i<SW;i+=3)P(i,88+((i*7)%9),1,1,C.grass2);
 for(const tr of TREES)tree(tr.x,tr.y);
 // rock cut on the far left once clearing is done
 if(v.km>=1){P(0,64,28,22,C.grey2);P(2,68,22,18,C.grey);P(4,70,6,4,C.grey3);P(14,74,8,5,C.grey3);P(6,79,10,4,C.grey2);P(0,84,28,2,C.grey2);}
 // dirt
 P(0,106,SW,80,C.dirt);for(const d of DOTS)P(d.x,d.y,2,1,C.dirt3);
 for(let y=146;y<186;y+=12)for(let x=(y%24)?0:6;x<320;x+=12)P(x,y,7,1,C.dirt4);
 for(const d of DOTS)if(d.y>150&&d.x%3===0){P(d.x,d.y,3,2,C.grey2);P(d.x,d.y,2,1,C.grey);}
 // the creek (very shallow)
 const cx=160;for(let y=106;y<127;y++){const w=hw(y);P(cx-w,y,2*w,1,y>=121?C.water:C.dirt2);P(cx-w,y,2,1,C.dirt4);P(cx+w-2,y,2,1,C.dirt4);}
 for(const s of SPECK){const y=121+Math.floor(s.y*5);const w=hw(y)-3;P(cx-w+Math.floor((s.x*2*w+t*6)%(2*w)),y,2,1,C.water2);}
 // stage 0 survey, 1 abutment forms, 2 bridge done, 3 multiplate, 4 base gravel, 5 paved
 const st=v.km<2?0:v.km<3?1:v.km<4?2:v.km<5?3:v.km<6?4:5;
 const rc=st<4?C.dirt3:st<5?'#b9ab8d':C.road;
 P(0,100,110,6,rc);P(210,100,110,6,rc);
 if(st>=5){for(let x=2;x<108;x+=10)P(x,103,4,1,C.dash);for(let x=212;x<320;x+=10)P(x,103,4,1,C.dash);}
 else if(st===4){for(let x=1;x<320;x+=5)P(x,101+(x%4),1,1,'#8f836a');}
 else{for(let x=0;x<320;x+=7)P(x,101+(x%4),2,1,C.dirt4);}
 if(st<2){P(110,100,100,6,C.dirt2);for(let x=112;x<208;x+=6)P(x,102+(x%3),2,1,C.dirt4);}
 if(st===0){P(150,110,1,8,'#fff');P(148,108,5,3,'#ff40a0');P(172,112,1,7,'#fff');P(170,110,5,3,'#ff40a0');}
 if(st===1){P(108,106,10,16,C.girder);P(108,106,10,1,C.girder2);for(let i=0;i<4;i++)P(110+i*2,100,1,6,C.rust);
  P(202,106,10,16,C.girder);P(202,106,10,1,C.girder2);for(let i=0;i<4;i++)P(204+i*2,100,1,6,C.rust);}
 if(st>=2){P(108,104,10,18,C.grey);P(108,104,2,18,C.grey3);P(202,104,10,18,C.grey);P(210,104,2,18,C.grey2);
  if(st<5){P(116,100,88,6,C.girder);P(116,100,88,1,C.girder2);P(116,105,88,1,C.girder3);}
  else{P(116,100,88,6,C.road);for(let x=118;x<204;x+=10)P(x,103,4,1,C.dash);P(116,106,88,3,C.girder);}
  P(114,98,92,2,C.grey3);}
 if(st>=3)multiplate(262,128,12,true);
 if(st===2){for(let i=0;i<3;i++)P(228+i*2,96-i*3,16,3,i%2?C.grey:C.grey3);}
 // ---- grass row (base 94): graves, dozer pushing, Fredis's truck
 v.graves.forEach((g,i)=>tombstone(284+(i%3)*10+(i>=3?5:0),72-(i>=3?10:0)));
 if(v.dozers>0){const ph=(ta*0.5)%1;const dx=214+ph*10;dozerR(dx,94,ta);const pile=4+ph*6;P(dx+29,94-pile,pile+3,pile,C.dirt3);P(dx+29,94-pile,pile+3,1,C.dirt);if(mv)puff(dx+16,94-21,t,0);}
 const fa=v.fredisAway||0,fl=v.fredisLeftAt||0,fr=v.fredisRetAt||0;
 if(v.fredisAlive!==false){let fx=null;
  if(fa>0){const d=t-fl;if(d<3.5)fx=250+d*40;}
  else{const d=t-fr;fx=(fr&&d<3.5)?Math.max(250,330-d*40):250;}
  if(fx!==null&&fx<330)pickup(fx,94,'#b3001b',t,false);}
 // ---- road row (base 100)
 pickup(0,100,C.white,t,mv);
 if(st>=1&&st<=2){if(v.crane>0)craneR(34,100,t,true,mv);else for(let i=0;i<3;i++)P(36,98-i*3,30,3,i%2?C.girder:C.girder2);}
 const n=Math.min(v.trucks,3);
 if(n>0){ctx.save();ctx.beginPath();ctx.rect(210*PX,0,110*PX,SH*PX);ctx.clip();
  for(let i=0;i<n;i++){const x=mv?330-((t*24+i*63)%200):250+i*34;rockTruck(x,100,i%2===0);if(mv)puff(x+9,100-19,t,i+1);}
  ctx.restore();}
 porta(306,100);
 cone(70,100);cone(216,100);
 if(st<5)barricade(110,100);
 // crew
 let i=0;for(const p of v.party){if(p.alive===false)continue;if(p.name==='Fredis'&&fa>0)continue;const bob=(mv&&Math.floor(t*4+i)%2)?-1:0;person(64+i*6.5,100+bob,p);i++;}
 for(const e of v.extras)person(e.x,100,e);
 // weather
 if(v.weather==='Snow')for(const f of FLAKES)P((f.x+t*8*f.v)%320,(f.y+t*25*f.v)%186,1,1,'#fff');
 if(v.weather==='Rain'||v.weather==='Sideways rain'){const sl=v.weather==='Rain'?1:4;for(const f of FLAKES)L((f.x+t*40*f.v*sl)%320,(f.y+t*120*f.v)%186,((f.x+t*40*f.v*sl)%320)+sl,((f.y+t*120*f.v)%186)+3,'#9fc7ff',0.3);}
