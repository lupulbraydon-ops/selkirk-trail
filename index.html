// Access gate: active everywhere except localhost / file://. Code is stored as a SHA-256 hash; change it with: node -e "console.log(require('crypto').createHash('sha256').update('NEWCODE').digest('hex'))"
const GATE={on:!['localhost','127.0.0.1',''].includes(location.hostname),hash:'a047f2788d705e78a5ed5771aba37362bb9100245b5d9e4b9c465df798c77e31'};
async function sha256(str){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}
function gateOpen(){try{return !GATE.on||localStorage.getItem('selkirk-gate')===GATE.hash;}catch(_){return !GATE.on;}}
async function askGate(){const v=prompt('Site access code:');if(v===null)return;const h=await sha256(v.trim().toUpperCase().replace(/s+/g,''));if(h===GATE.hash){try{localStorage.setItem('selkirk-gate',h);}catch(_){}S.screen='title';S.sel=0;}else{S.gateMsg=rnd(['Wrong code. Andy has been notified.','Wrong code. Mel would like a memo.','Wrong code. Tanya has shut down the site.']);}}
let PX=4;                       // logical pixel scale (320x186 scene)
const SW=320,SH=186;
function P(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x)*PX,Math.round(y)*PX,Math.round(w)*PX,Math.round(h)*PX);}
function L(x1,y1,x2,y2,c,w){ctx.strokeStyle=c;ctx.lineWidth=(w||1)*PX;ctx.beginPath();ctx.moveTo(x1*PX,y1*PX);ctx.lineTo(x2*PX,y2*PX);ctx.stroke();}
function txt(s,x,y,size,color,align){ctx.font=size+'px "VT323", "Courier New", monospace';ctx.fillStyle=color||'#fff';ctx.textAlign=align||'left';ctx.textBaseline='top';ctx.fillText(s,x,y);}
function wrap(s,max){const out=[];for(const para of String(s).split('\n')){let line='';for(const w of para.split(' ')){if((line+' '+w).trim().length>max){out.push(line.trim());line=w;}else line+=' '+w;}out.push(line.trim());}return out;}
function fmt(n){n=Math.round(n);const neg=n<0;n=Math.abs(n);let s=n>=1e6?'$'+(n/1e6).toFixed(1)+'M':n>=1000?'$'+Math.round(n/1000)+'K':'$'+n;return (neg?'-':'')+s;}
function fmtFull(n){return (n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('en-CA');}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function pickW(arr){let t=0;for(const e of arr)t+=e.w;let r=Math.random()*t;for(const e of arr){r-=e.w;if(r<=0)return e;}return arr[arr.length-1];}

// ---------------- tuning ----------------
const CFG={speed:0.14,evRate:0.42,illRate:0.07,burn:600000,lateKill:8};
// ---------------- state ----------------
let S;
function newGame(){S={screen:'title',week:1,km:0,loss:0,cash:0,fuel:0,coffee:0,vests:6,tracks:0,trucks:0,dozers:0,graders:0,crane:0,
 pace:0,ration:0,weather:'Clear',party:PARTY_DEF.map(p=>Object.assign({},p,{health:100,alive:true,cond:null,condWeeks:0,gone:''})),
 graves:[],role:null,name:'',moving:false,msIndex:0,page:0,sel:0,queue:[],ret:'travel',lastTick:0,deathReason:'',fired:0,quit:0,late:0,extras:[],fredisAway:0,fredisLeftAt:0,fredisRetAt:0,blasted:false,picked:false,papered:false,phoned:false,pumped:false};}
newGame();if(!gateOpen())S.screen='gate';
const alive=()=>S.party.filter(p=>p.alive);
const fredisHere=()=>{const f=S.party.find(p=>p.name==='Fredis');return !!(f&&f.alive)&&S.fredisAway<=0;};
const fredisAlive=()=>{const f=S.party.find(p=>p.name==='Fredis');return !!(f&&f.alive);};
const now=()=>performance.now()/1000;
function fredisLeaves(weeks){S.fredisAway=weeks;S.fredisLeftAt=now();}
const FREDIS_TALK=["Fredis looks at you. Fredis says nothing. Fredis gets in his truck.","You say 'Morning, Fredis.' Fredis says nothing. The silence lasts four minutes. You leave.","Fredis is on the phone in Spanish. It is not a happy call. He points east, toward Calgary.","Fredis's reply is a single word. It is not a word you know. Tanya confirms it is not a safety word.","Fredis nods. It is the most he has said all month. Scott calls it a breakthrough."];
const burn=()=>CFG.burn*[1,1.25,1.7][S.pace];
const PACES=['Steady (MOTI approved)','Strenuous (10s, 6 days)','Grueling (24/7, lights on)'];
const RATIONS=['Filling (double-double)','Meager (one per shift)','Bare bones (instant)'];

function show(m){S.queue.push(m);S.screen='msg';S.sel=0;S.moving=false;}
function applyFx(fx){if(!fx)return;
 if(fx.weeks){S.week+=fx.weeks;S.loss+=burn()*fx.weeks;}
 if(fx.loss)S.loss+=fx.loss;
 for(const k of ['fuel','coffee','trucks','dozers','graders','vests','tracks','crane'])if(fx[k])S[k]=Math.max(0,S[k]+fx[k]);
 if(fx.health)for(const p of alive())p.health=Math.max(1,Math.min(100,p.health+fx.health));
}
function fire(reason){const a=alive();if(!a.length){gameover(reason);return;}
 const v=rnd(a);v.alive=false;v.gone='Andy';S.fired++;S.graves.push({name:v.name,epi:reason});
 show({t:`Andy Smith killed ${v.name} because ${reason}.`,andy:true});}
function leave(p){p.alive=false;p.gone='quit';S.quit++;S.graves.push({name:p.name,epi:'went to the ski hill'});
 if(p.name==='Fredis'){S.fredisAway=0;fredisLeaves(999);show({t:"Fredis went to Calgary and did not come back. He sent one text. It said 'no'."});return;}
 show({t:`${p.name} quit to go work at Kicking Horse Resort. ${p.name} says the snow is more reliable than the schedule.`});}
function gameover(reason){S.deathReason=reason;S.moving=false;S.screen='dead';S.queue=[];}
function randomEvent(){const pool=EVENTS.filter(e=>!e.cond||e.cond(S));const e=pickW(pool);
 if(e.kill){show({t:e.t,then:()=>fire(e.kill)});return;}
 if(e.mg){show({t:e.t,then:()=>startMG(e.mg)});return;}
 if(e.ch){show({t:e.t,ch:e.ch.filter(c=>!c.cond||c.cond(S))});return;}
 applyFx(e.fx);if(e.on)e.on(S);show({t:e.t});}
function illness(){const a=alive();if(!a.length)return;const p=rnd(a.filter(x=>!x.cond));if(!p)return;p.cond=rnd(CONDS);p.condWeeks=4;show({t:`${p.name} has ${p.cond}.`});}

function tick(){
 S.week++;
 S.weather=pickW(WEATHERS).n;
 const wf=S.weather==='Snow'?0.7:S.weather==='Smoke'?0.85:S.weather==='Sideways rain'?0.9:1;
 const fleet=S.dozers>0?0.6+0.08*Math.min(S.trucks,6)+(S.graders>0?0.1:0):0.35;
 const pf=[1,1.3,1.6][S.pace];
 let speed=CFG.speed*fleet*pf*wf; if(S.fuel<=0)speed*=0.3;
 if(S.msIndex===2&&!fredisHere())speed*=0.6;   // bridge without the bridge super
 if(S.fredisAway>0&&S.fredisAway<900){if(--S.fredisAway<=0){S.fredisRetAt=now();show({t:rnd(["Fredis is back from Calgary. He is angrier. The abutment forms are, somehow, perfect.","Fredis returned at 4 a.m. He did not say where he was. Nobody asked. His truck has new tires.","Fredis is back. He walked past everyone, looked at the creek for an hour, and went into the trailer."])});return;}}
 const use=(200+S.trucks*350+S.dozers*500+S.graders*250+S.crane*150)*pf;
 const hadFuel=S.fuel>0; S.fuel=Math.max(0,S.fuel-use);
 S.coffee=Math.max(0,S.coffee-[14,7,3][S.ration]*alive().length);
 S.loss+=burn();
 const dh=[-1,-2,-4][S.pace]+[2,0,-2][S.ration]+(S.coffee<=0?-4:0)+(S.weather==='Snow'?-2:0);
 for(const p of alive()){p.health+=dh;if(p.cond){p.health-=6;if(--p.condWeeks<=0)p.cond=null;}p.health=Math.min(100,p.health);
  if(p.health<=0){leave(p);return;}}
 const next=MILESTONES[S.msIndex];
 S.km=Math.min(S.km+speed,next.km);
 if(S.km>=next.km){reachMilestone(next);return;}
 if(!S.phoned&&S.km>=0.5&&S.km<1){S.phoned=true;show({t:"Scott's phone has not stopped since mobilization. He hands it to you and walks toward the bridge without a word.",then:()=>startMG('phone')});return;}
 if(!S.pumped&&S.km>=4.5&&S.km<5){S.pumped=true;show({t:"Cross culvert at 4+600. Adam's crew has the trench open. It has been raining since Tuesday.",then:()=>startMG('pump')});return;}
 if(!S.blasted&&S.km>=1.4&&S.km<2){S.blasted=true;show({t:"Lenny: 'Holes are drilled. Powder truck's here. You're loading.'",then:()=>startMG('blast')});return;}
 if(!S.papered&&S.km>=3.3&&S.km<4){S.papered=true;show({t:"Mel wants the ATP package for the multiplate by noon. Harsh has been 'compiling'. You have seen what Harsh compiles.",then:()=>startMG('paper')});return;}
 if(!S.picked&&S.km>=2.4&&S.km<3&&S.crane>0){S.picked=true;show({t:fredisHere()?"Fredis walked out to the abutment, pointed at the girders, pointed at the crane, and crossed his arms.":"Fredis is in Calgary. The girders are here. Scott says 'you've seen him do it', which is not the same as knowing how.",then:()=>startMG('pick')});return;}
 if(S.fuel<=0&&hadFuel){applyFx({weeks:1,loss:45000,fuel:20000});show({t:"You are out of diesel. Louie siphons the pickup. A fuel truck from Golden brings 20,000 L a week later. $45,000, plus a tip."});return;}
 if(S.coffee<=0&&Math.random()<0.25){show({t:rnd(["The crew is out of coffee. Adam has stopped blinking.","No coffee. Scott is drinking hydraulic fluid 'as a joke'. It is not a joke.","Coffee gone. Lenny has started a fire just to feel something."])});return;}
 const r=Math.random();
 if(r<CFG.illRate)illness(); else if(r<CFG.illRate+CFG.evRate)randomEvent();
}
function reachMilestone(m){S.moving=false;S.msIndex++;S.msCur=m;S.late=Math.max(0,S.week-m.deadline);
 if(S.late>CFG.lateKill){gameover(m.fail);return;}
 if(m.final){S.screen='win';S.page=0;return;}
 S.screen='milestone';S.sel=0;}
function afterMilestone(){const m=S.msCur;S.screen='travel';S.moving=true;S.ret='travel';
 if(m.km===2&&S.crane<=0){applyFx({weeks:4,loss:2500000,crane:1});show({t:"The creek bridge is next and you have no crane. Sterling Crane sends one from Calgary: four weeks and $2,500,000. Fredis watched you not order it. He said nothing."});}
 if(m.km===1&&S.trucks>0)show({t:"Lenny: 'Clearing's done. Now the real work. Get in the excavator and load some trucks.'",then:()=>startMG('load')});
 if(m.km===4&&S.graders>0)show({t:"Lenny: 'Grade's yours. Don't embarrass me in front of Mel.'",then:()=>startMG('grade')});
 if(S.late>0)fire(`${m.name} finished ${S.late} week${S.late>1?'s':''} late`);}

 summary(t){drawScene(viewFromState({night:true}),t);ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillRect(60,30,1160,690);ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.strokeRect(60,30,1160,690);
  const sc=score();txt('FINAL REPORT TO ANDY',640,50,48,'#ffd400','center');let y=130;
  const rows=[`Weeks on site: ${S.week}`,`Kilometres built: ${S.km.toFixed(1)} of 6`,`EllisDon loss: ${fmtFull(S.loss)}`,`Crew still employed: ${alive().map(p=>p.name).join(', ')||'nobody'}`,`Killed by Andy: ${S.party.filter(p=>p.gone==='Andy').map(p=>p.name).join(', ')||'nobody'}`,`Quit for the ski hill: ${S.party.filter(p=>p.gone==='quit').map(p=>p.name).join(', ')||'nobody'}`,`Role: ${S.role?S.role.name:'-'} (x${S.role?S.role.mult:1} points)`];
  for(const r of rows){txt(r,120,y,34,'#fff');y+=46;}y+=20;txt(`SCORE: ${sc.pts.toLocaleString()} points`,640,y,52,'#ffd400','center');txt(`Rank: ${sc.rank}`,640,y+64,36,'#fff','center');
  box();txt((TOUCH?'Tap':'Press ENTER')+' to return to the title. Andy will be in touch.',640,830,32,'#bdbdbd','center');},
};
function score(){const a=alive().length;let pts=a*500+Math.max(0,45000000-S.loss)/50000+S.trucks*100+S.dozers*150+(S.crane?200:0)+Math.round(S.km*100)-S.late*50;if(S.screen==='dead'||S.deathReason)pts*=0.25;pts=Math.round(pts*(S.role?S.role.mult:1));
 const rank=S.deathReason?'Transferred to Fort McMurray':pts>4000?'Superintendent of the Year (Andy abstained)':pts>2500?"Andy is 'proud' (his word, his quotes)":pts>1200?'Adequate. Mel disagrees.':'Reassigned to snow removal';return{pts,rank};}

const KEY={
 gate(k){if(k==='Enter'||k===' ')askGate();},
 mgIntro(k){if(k==='Enter'||k===' '){S.mg.phase=S.mg.type==='pick'?'swing':'play';S.screen=MG_SCREEN[S.mg.type];}},
 mgBlast(k){if(k==='Enter'||k===' ')lockCharge();},
 mgPhone(k){if(/^[1-3]$/.test(k))answerCall(+k-1);},
 mgPump(k){if(k.length===1||k==='Enter'||k.startsWith('Arrow'))pumpStroke();},
 mgPaper(k){if(k==='ArrowLeft'||k==='a'||k==='shred')handleDoc('shred');else if(k==='ArrowRight'||k==='d'||k==='Enter'||k===' '||k==='submit')handleDoc('submit');},
 mgPick(k){if(k==='Enter'||k===' ')startLower();},
 mgMenu(k){const i=menuKey(k,8);if(i<0)return;const need=[['load',S.trucks>0,"No rock trucks to load. Lenny laughs for a long time."],['blast',true,''],['pick',S.crane>0,"No crane. Fredis looks at the girders, then at you, then at his truck."],['grade',S.graders>0,"No grader. Louie offers to 'eyeball it' with the dozer. Mel would notice."],['paper',true,''],['phone',true,''],['pump',true,'']];if(i===7){S.screen='menu';S.sel=0;return;}const [ty,ok,msg]=need[i];if(ok)startMG(ty);else{S.ret='menu';show({t:msg});}},
 mgLoad(k){if(k==='Enter'||k===' ')dumpBucket();},
 mgGrade(k){},
 title(k){const i=menuKey(k,3);if(i===0){const nm=S.name;newGame();S.name=nm;S.screen='intro';S.page=0;}else if(i===1){S.screen='about';S.page=0;}else if(i===2){show({t:"There is no Top Ten. Andy deleted it after someone put Mel in the number one spot."});S.ret='title';}},
 intro(k){if(k==='Enter'||k===' '){if(++S.page>=INTRO.length){S.screen='name';}}},
 about(k){if(k==='Enter'||k===' '){if(++S.page>=ABOUT.length){S.screen='title';S.sel=0;}}},
 name(k){if(k==='Enter'){if(!S.name.trim())S.name='Boss';S.screen='role';S.sel=0;}else if(k==='Backspace')S.name=S.name.slice(0,-1);else if(k.length===1&&/[a-zA-Z0-9 .'-]/.test(k)&&S.name.length<14)S.name+=k;},
 role(k){const i=menuKey(k,3);if(i>=0){S.role=ROLES[i];S.cash=ROLES[i].cash;S.screen='crew';}},
 crew(k){if(k==='Enter'||k===' '){S.screen='store';S.sel=0;}},
 store(k){const n=STORE.length+1;if(k==='ArrowUp')S.sel=(S.sel+n-1)%n;else if(k==='ArrowDown')S.sel=(S.sel+1)%n;
  else if(S.sel<STORE.length&&(k==='ArrowRight'||k==='+'||k==='=')){const it=STORE[S.sel];if(it.max&&S[it.key]>=it.max)S.storeMsg='You only need one crane. Probably.';else if(S.cash<it.price)S.storeMsg="Louie: 'Andy is not going to approve that.'";else{S.cash-=it.price;S[it.key]+=it.step;S.storeMsg=`Bought ${it.name}.`;}}
  else if(S.sel<STORE.length&&(k==='ArrowLeft'||k==='-')){const it=STORE[S.sel];if(S[it.key]>=it.step){S[it.key]-=it.step;S.cash+=it.price;S.storeMsg=`Returned ${it.name}. Finning sighs.`;}}
  else if(k==='Enter'&&S.sel===STORE.length){S.screen='travel';S.moving=true;S.week=1;S.ret='travel';
   show({t:`Week 1. You leave the Golden yard with ${S.trucks} rock truck${S.trucks===1?'':'s'}, ${S.dozers} dozer${S.dozers===1?'':'s'}, ${S.fuel.toLocaleString()} litres of diesel and ${S.coffee} cups of coffee.\nAndy's deadline for Substantial Completion is Week 68. Good luck. You'll need it.`});
   if(S.dozers===0)show({t:"Lenny: 'No dozer? We're clearing six kilometres of mountain with a pickup and vibes?' Progress will be slow."});}
  else if(k==='Enter'){const it=STORE[S.sel];if(S.cash>=it.price&&!(it.max&&S[it.key]>=it.max)){S.cash-=it.price;S[it.key]+=it.step;S.storeMsg=`Bought ${it.name}.`;}}},
 travel(k){if(k==='Enter'||k===' '||k==='Escape'){S.moving=false;S.screen='menu';S.sel=0;}},
 menu(k){const i=menuKey(k,9);if(i===8){S.screen='mgMenu';S.sel=0;return;}if(i===0){S.screen='travel';S.moving=true;}else if(i===1)S.screen='status';else if(i===2){S.screen='pace';S.sel=S.pace;}else if(i===3){S.screen='ration';S.sel=S.ration;}
  else if(i===7){S.ret='menu';if(!fredisAlive())show({t:"Fredis is gone. His hard hat is still on the hook. Nobody will touch it."});else if(!fredisHere())show({t:"Fredis is in Calgary. Nobody knows why. Nobody will ask."});else show({t:rnd(FREDIS_TALK)});}
  else if(i===4){S.week++;S.loss+=burn();for(const p of alive()){p.health=Math.min(100,p.health+15);p.cond=null;}S.ret='menu';show({t:rnd(["The crew rests for a week. Andy notices. Andy always notices.","A week off. Louie goes fishing. Scott goes to Calgary. Lenny reads the spec. Nobody knows why.","Rest week. Tanya holds an optional safety meeting. Attendance is mandatory."])});}
  else if(i===5){for(const p of alive())p.health=Math.max(1,p.health-2);S.ret='menu';show({t:rnd(ANDY_CALLS)});}
  else if(i===6){const sick=alive().filter(p=>p.cond);S.week++;S.loss+=burn();if(sick.length){for(const p of sick)p.cond=null;S.ret='menu';show({t:`Tanya runs a wellness toolbox talk. It lasts a week. ${sick.map(p=>p.name).join(' and ')} feel${sick.length>1?'':'s'} better. Everyone else feels lectured.`});}else{S.ret='menu';show({t:rnd(["Tanya: 'Where is your hi-vis?' You are wearing it. She checks the tag anyway. One week passes.","Tanya shows you a 40-slide deck on ladder safety. There are still no ladders. One week passes."])});}}},
 pace(k){const i=menuKey(k,3);if(i>=0){S.pace=i;S.screen='menu';S.sel=0;}},
 ration(k){const i=menuKey(k,3);if(i>=0){S.ration=i;S.screen='menu';S.sel=0;}},
 status(k){if(k==='Enter'||k===' '||k==='Escape'){S.screen='menu';S.sel=0;}},
 msg(k){const m=S.queue[0];if(!m){S.screen=S.ret||'travel';return;}
  if(m.ch){const i=menuKey(k,m.ch.length);if(i<0)return;const c=m.ch[i];const out=c.run?c.run(S):{t:c.t,fx:c.fx,on:c.on};applyFx(out.fx);if(out.on)out.on(S);S.queue.shift();if(out.t)S.queue.unshift({t:out.t});S.sel=0;if(!S.queue.length)finishMsg();return;}
  if(k==='Enter'||k===' '){S.queue.shift();if(m.then)m.then();if(S.screen==='msg'&&!S.queue.length)finishMsg();}},
 milestone(k){const i=menuKey(k,3);const m=S.msCur;if(i===0)afterMilestone();else if(i===1){S.ret='milestone';show({t:m.mel});}else if(i===2){S.ret='milestone';show({t:m.look});}},
 dead(k){if(k==='Enter'||k===' '){S.screen='summary';}},
 win(k){if(k==='Enter'||k===' '){if(++S.page>=3)S.screen='summary';}},
 summary(k){if(k==='Enter'||k===' '){const nm=S.name;newGame();S.name=nm;S.screen='title';S.sel=0;}},
};
function finishMsg(){const r=S.ret||'travel';S.ret='travel';if(S.screen!=='msg')return;S.screen=r;if(r==='travel')S.moving=true;if(r==='menu'||r==='title'||r==='milestone')S.sel=0;}

// ---------------- loop + input ----------------
let last=0;
function frame(ms){const t=ms/1000;DT=Math.min(0.05,Math.max(0,(ms-lastMs)/1000));lastMs=ms;if(S.screen==='travel'&&S.moving&&ms-S.lastTick>850){S.lastTick=ms;tick();}
 ctx.imageSmoothingEnabled=false;HIT=[];(DRAW[S.screen]||DRAW.title)(t);requestAnimationFrame(frame);}
document.addEventListener('keyup',e=>KEYS.delete(e.key));
document.addEventListener('keydown',e=>{const k=e.key;KEYS.add(k);if(e.repeat&&S.screen.startsWith('mg'))return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Enter','Backspace'].includes(k))e.preventDefault();(KEY[S.screen]||KEY.title)(k);});
function canvasPoint(e){const r=cv.getBoundingClientRect();if(r.height>r.width)return{x:(e.clientY-r.top)/r.height*1280,y:(r.right-e.clientX)/r.width*960};return{x:(e.clientX-r.left)/r.width*1280,y:(e.clientY-r.top)/r.height*960};}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.focus();}catch(_){}
 const p=canvasPoint(e);const h=HIT.find(z=>p.x>=z.x0&&p.x<=z.x1&&p.y>=z.y0&&p.y<=z.y1);
 if(S.screen==='gate'){askGate();return;}
 if(S.screen==='mgGrade'&&S.mg){S.mg.pointerDown=true;S.mg.target=p.y/8;return;}
 if(S.screen==='mgLoad'){dumpBucket();return;}
 if(S.screen==='mgBlast'){lockCharge();return;}
 if(S.screen==='mgPump'){pumpStroke();return;}
 if(S.screen==='mgPhone'){if(h)KEY.mgPhone(h.key);return;}
 if(S.screen==='mgPick'){startLower();return;}
 if(S.screen==='name'){const v=prompt('What is your name, boss?',S.name);if(v!==null)S.name=v.trim().slice(0,14)||'Boss';KEY.name('Enter');return;}
 if(S.screen==='store'){if(!h)return;if(h.key==='go'){S.sel=STORE.length;KEY.store('Enter');return;}const [act,i]=h.key.split(':');S.sel=+i;if(act==='plus')KEY.store('ArrowRight');else if(act==='minus')KEY.store('ArrowLeft');return;}
 (KEY[S.screen]||KEY.title)(h?h.key:'Enter');});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointermove',e=>{if(S.screen==='mgGrade'&&S.mg&&S.mg.pointerDown){S.mg.target=canvasPoint(e).y/8;}});
const endDrag=()=>{if(S.mg){S.mg.pointerDown=false;S.mg.target=null;}};cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);cv.addEventListener('pointerleave',endDrag);
window.ST={CFG,get S(){return S;},set:o=>Object.assign(S,o),go:s=>{S.screen=s;},show,fire,gameover,newGame:()=>{newGame();},ROLES,MILESTONES};
document.fonts&&document.fonts.load('36px "VT323"').then(()=>{}).catch(()=>{});
requestAnimationFrame(frame);
